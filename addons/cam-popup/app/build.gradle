plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.abd3lraouf.campopup'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.abd3lraouf.campopup'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Media3's RTSP client plays the DVR's sub-stream on the TV's hardware decoder; no UI module, a bare
    // TextureView is all the pop-up needs.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    testImplementation 'junit:junit:4.13.2'
}
